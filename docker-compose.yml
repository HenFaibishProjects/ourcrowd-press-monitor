version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: press-monitor-db
    restart: always
    environment:
      POSTGRES_DB: ourcrowd_press_monitor
      POSTGRES_USER: ourcrowd
      POSTGRES_PASSWORD: ourcrowd
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourcrowd -d ourcrowd_press_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
